<!doctype html>
<html lang="en">

<head>
    <title>Crear Producto</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-sm navbar-light bg-light" id="V_NavBar">
               
    </nav>
    
    <!-- -Crear Formulario Centrado  
    -Producto
    -Detalle
    -Monto
    -Cantidad
    -Boton -->
    <!-- margin 0 auto -->
     <!-- flex: row columns justify content center  -->

    <div class="container d-flex justify-content-center">
        <div class="col-md-6 "> 
          <h2 class="text-center">Formulario de Producto</h2>
          <form>
            <div class="form-group">
              <label for="producto">Producto</label>
              <input type="text" class="form-control" id="producto" placeholder="Ingrese el nombre del producto">
            </div>
            <div class="form-group">
              <label for="detalle">Detalle</label>
              <input type="text" class="form-control" id="detalle" placeholder="Ingrese el detalle del producto">
            </div>
            <div class="form-group">
              <label for="monto">Monto</label>
              <input type="number" class="form-control" id="monto" placeholder="Ingrese el monto del producto">
            </div>
            <div class="form-group">
              <label for="cantidad">Cantidad</label>
              <input type="number" class="form-control" id="cantidad" placeholder="Ingrese la cantidad del producto">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Enviar</button>
          </form>
        </div>
      </div>







        <!-- Optional JavaScript -->
        <!-- jQuery first, then Popper.js, then Bootstrap JS -->
        <script src="/JS/NavBar.js"></script>
        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
            integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
            crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
            integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
            crossorigin="anonymous"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
            integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
            crossorigin="anonymous"></script>
</body>

</html>
